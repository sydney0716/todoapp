name: personaltodo
description: Flutter migration of the Todo App Android app.
publish_to: "none"
version: 1.0.0+10

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  connectivity_plus: ^7.3.2
  cupertino_icons: ^2.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  home_widget: ^0.10.0
  http: ^1.6.0
  path: ^1.9.0
  sqflite: ^2.3.3
  sqflite_common_ffi_web: ^1.2.0
  web: ^1.1.1
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  assets:
    - assets/textures/paper_background_v2.png
  fonts:
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR.ttf
