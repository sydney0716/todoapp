<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="두 사람을 위한 할 일 앱 · Personal Todo">
  <meta name="theme-color" content="#F6EAD8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Personal Todo">
  <link rel="apple-touch-icon" href="icons/Icon-180.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Personal Todo</title>
  <style>
    html, body { margin: 0; height: 100%; background: #F6EAD8; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center;
      text-align: center; color: #8B5E34; font: 16px system-ui, sans-serif; padding: 24px; }
    #loading img { width: 80px; height: 80px; margin: 0 auto 16px; border-radius: 18px; }
    #loading button { padding: 10px 16px; margin-top: 16px; font: inherit; }
  </style>
</head>
<body>
  <div id="loading" role="status">
    <img src="icons/Icon-180.png" alt="">
    <span>Personal Todo</span>
  </div>
  <noscript>Personal Todo requires JavaScript to be enabled.</noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
